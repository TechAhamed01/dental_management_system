class: Dentist
table: dentist
fields:
  dentistCode: String?
  fullName: String
  email: String
  phone: String
  passwordHash: String
  dateOfBirth: String?
  licenseNumber: String
  specialization: String
  qualification: String?
  experience: int
  clinicName: String
  clinicAddress: String
  profilePhotoUrl: String?
  registrationFileUrl: String?
  degreeFileUrl: String?
  idFileUrl: String?
  isTermsAccepted: bool
  status: DentistStatus
  suspendedAt: DateTime?
  suspensionEndsAt: DateTime?
  suspensionReason: String?
  suspendedBy: String?
  terminatedAt: DateTime?
  terminationReason: String?
  terminatedBy: String?
  hospitalId: int?
  hospital: Hospital?, relation(field=hospitalId)
indexes:
  dentist_code_idx:
    fields: dentistCode
    unique: true
