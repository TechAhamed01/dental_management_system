services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dental
      POSTGRES_PASSWORD: "eiiJev8KBqEzRKhUgL0_E-xadA7dt6mu"
    volumes:
      - dental_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "hcmstkcCSpOJoslIIMuI0KFvKPYXgv0o"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dental_test
      POSTGRES_PASSWORD: "2irAAJLq745j3fnxZL4V5gBilBgSChbn"
    volumes:
      - dental_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "9atZmp0JbNdfjwwpmDQyWSaBHixb9xN8"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  dental_data:
  dental_test_data:
