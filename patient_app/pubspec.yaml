name: patient_app
description: "Patient Application for Dental Management System"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  serverpod_flutter: ^3.4.11
  serverpod_client: ^3.4.11
  flutter_secure_storage: ^10.0.0
  dental_client:
    path: ../dental/dental_client

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/